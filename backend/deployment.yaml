apiVersion: apps/v1
kind: Deployment
metadata:
  name: contact-form-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contact-form-backend
  template:
    metadata:
      labels:
        app: contact-form-backend
    spec:
      containers:
      - name: contact-form-backend
        image: contact-form-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        - name: EMAIL_USER
          valueFrom:
            secretKeyRef:
              name: contact-form-secrets
              key: email-user
        - name: EMAIL_PASS
          valueFrom:
            secretKeyRef:
              name: contact-form-secrets
              key: email-pass
        - name: EMAIL_RECIPIENT
          valueFrom:
            secretKeyRef:
              name: contact-form-secrets
              key: email-recipient
---
apiVersion: v1
kind: Service
metadata:
  name: contact-form-backend
spec:
  selector:
    app: contact-form-backend
  ports:
  - port: 80
    targetPort: 5000
  type: ClusterIP 